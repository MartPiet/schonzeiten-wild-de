name: Build manifest, all.json & species.json

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build-manifest.mjs'
      - 'scripts/lint-data.mjs'
      - 'scripts/slug.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint-Regeln testen
        run: node --test scripts/lint-data.test.mjs
      - name: Daten prüfen und generierte Dateien neu bauen
        run: node scripts/build-manifest.mjs
      - name: Committen, falls geändert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json all.json species.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen an den generierten Dateien."
          else
            git commit -m "chore: manifest/all.json/species.json aktualisiert [skip ci]"
            git push
          fi
